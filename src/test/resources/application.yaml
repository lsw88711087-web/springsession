spring:
  datasource:
    url: jdbc:h2:mem:springsession_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false


jwt:
  secret: "test-only-jwt-secret-key-at-least-32-bytes-long"
  access-token-validity: 1800000
  refresh-token-validity: 1209600000
