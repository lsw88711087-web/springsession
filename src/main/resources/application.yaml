# Django의 settings.py와 같은 역할을 하는 파일입니다.
spring:
  application:
    name: springsession
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/likelion_blog}   # ← 바뀐 줄
    username: ${DB_USERNAME:likelion}                          # ← 바뀐 줄
    password: ${DB_PASSWORD}                                   # 그대로

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
    secret: ${JWT_SECRET}
    access-token-validity: 1800000        # 30분  (밀리초)
    refresh-token-validity: 1209600000    # 14일  (Part 6에서 씁니다)

